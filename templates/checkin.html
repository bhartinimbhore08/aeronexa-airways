{% extends "base.html" %}

{% block title %}Online Check-in | Aeronexa Airways{% endblock %}

{% block content %}
<div class="container" style="padding-top:3rem; max-width:700px;">
  
  <div class="card" style="border:2px solid var(--gold);">
    <div style="text-align:center; margin-bottom:2rem;">
      <span class="badge badge-gold" style="margin-bottom:0.5rem;">ONLINE CHECK-IN</span>
      <h2>Check In & Get Boarding Pass</h2>
      <p style="font-size:0.9rem; color:var(--gray-600);">Online check-in opens 48 hours prior to scheduled flight departure.</p>
    </div>

    <form id="checkin-search-form" style="margin-bottom:1.5rem;">
      <div class="form-group">
        <label class="form-label">Booking Reference (PNR) *</label>
        <input type="text" class="form-control" name="pnr" id="checkin-pnr" placeholder="e.g. AX7K9P" required style="text-transform:uppercase;">
      </div>
      <div class="form-group">
        <label class="form-label">Passenger Last Name *</label>
        <input type="text" class="form-control" name="last_name" id="checkin-lastname" placeholder="e.g. Nimbhore" required>
      </div>
      <button type="submit" class="btn btn-gold btn-lg" style="width:100%;">
        Find Booking & Check In →
      </button>
    </form>

    <div id="checkin-result-container"></div>
  </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', () => {
  const urlParams = new URLSearchParams(window.location.search);
  const pnrParam = urlParams.get('pnr');
  if (pnrParam) {
    const pnrInput = document.getElementById('checkin-pnr');
    if (pnrInput) pnrInput.value = pnrParam;
  }

  const form = document.getElementById('checkin-search-form');
  const container = document.getElementById('checkin-result-container');

  if (form) {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pnr = form.pnr.value.trim().toUpperCase();
      const last_name = form.last_name.value.trim();

      container.innerHTML = '<div style="text-align:center; padding:1rem;">Processing Check-in...</div>';

      try {
        const res = await fetch('/api/checkin', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ pnr, last_name })
        });

        const data = await res.json();

        if (res.ok) {
          window.Aeronexa.showToast(data.message, 'success');
          container.innerHTML = `
            <div style="background-color:rgba(25,135,84,0.1); border:1px solid var(--success); padding:1.5rem; border-radius:var(--radius-md); text-align:center; margin-top:1rem;">
              <div style="font-size:2rem; color:var(--success);">✓</div>
              <h3 style="color:var(--navy);">Check-in Complete!</h3>
              <p style="margin:0.5rem 0 1.25rem 0;">Your digital boarding pass has been issued for PNR <strong>${pnr}</strong>.</p>
              <a href="/boarding-pass?pnr=${pnr}" class="btn btn-navy btn-lg">
                View & Print Boarding Pass →
              </a>
            </div>
          `;
        } else {
          container.innerHTML = `
            <div style="background-color:rgba(220,53,69,0.1); border:1px solid var(--danger); padding:1rem; border-radius:var(--radius-md); color:var(--danger); text-align:center; margin-top:1rem;">
              ${data.error || 'Check-in failed.'}
            </div>
          `;
        }

      } catch (err) {
        container.innerHTML = `<div style="color:var(--danger); text-align:center;">Network error performing check-in.</div>`;
      }
    });
  }
});
</script>
{% endblock %}
