{% extends "base.html" %}

{% block title %}Flight Status & Live Tracker | Aeronexa Airways{% endblock %}

{% block content %}
<div class="container" style="padding-top:2.5rem; max-width:900px;">
  
  <div class="card" style="margin-bottom:2rem;">
    <h2 style="color:var(--navy); margin-bottom:1rem;">Live Aeronexa Flight Tracker</h2>
    <form id="status-search-form" style="display:flex; gap:0.75rem; flex-wrap:wrap;">
      <input type="text" class="form-control" id="status-query" placeholder="Enter Flight Number (e.g. AX204, AX301) or Airport Code" style="flex:1; min-width:240px;">
      <button type="submit" class="btn btn-gold">Check Status</button>
    </form>
  </div>

  <div id="status-results-container"></div>

</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', () => {
  loadStatusData('');

  const form = document.getElementById('status-search-form');
  if (form) {
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const q = document.getElementById('status-query').value.trim();
      loadStatusData(q);
    });
  }
});

async function loadStatusData(query) {
  const container = document.getElementById('status-results-container');
  container.innerHTML = '<div style="text-align:center; padding:2rem;">Loading live flight status...</div>';

  try {
    const res = await fetch(`/api/flight-status?q=${encodeURIComponent(query)}`);
    const data = await res.json();

    if (!res.ok || data.flights.length === 0) {
      container.innerHTML = '<div class="card" style="text-align:center;">No matching flight status records found.</div>';
      return;
    }

    container.innerHTML = data.flights.map(fl => `
      <div class="card" style="margin-bottom:1.25rem;">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; border-bottom:1px solid var(--gray-200); padding-bottom:0.75rem; margin-bottom:1rem;">
          <div>
            <span class="badge badge-gold">${fl.flight_number}</span>
            <span style="font-weight:700; color:var(--navy); margin-left:0.5rem;">${fl.origin_city} (${fl.origin}) → ${fl.dest_city} (${fl.destination})</span>
          </div>
          <div>
            <span class="badge ${fl.status === 'On Time' ? 'badge-success' : (fl.status === 'Boarding' ? 'badge-warning' : 'badge-navy')}">
              ${fl.status}
            </span>
          </div>
        </div>

        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:1rem; font-size:0.9rem;">
          <div>
            <div style="color:var(--gray-400); font-size:0.8rem;">SCHEDULED DEPARTURE</div>
            <div style="font-weight:700; color:var(--navy); font-size:1.1rem;">${fl.departure_time}</div>
          </div>
          <div>
            <div style="color:var(--gray-400); font-size:0.8rem;">SCHEDULED ARRIVAL</div>
            <div style="font-weight:700; color:var(--navy); font-size:1.1rem;">${fl.arrival_time}</div>
          </div>
          <div>
            <div style="color:var(--gray-400); font-size:0.8rem;">GATE / TERMINAL</div>
            <div style="font-weight:700; color:var(--navy);">Gate G14 • Terminal 2</div>
          </div>
          <div>
            <div style="color:var(--gray-400); font-size:0.8rem;">AIRCRAFT</div>
            <div style="font-weight:700; color:var(--navy);">${fl.aircraft}</div>
          </div>
        </div>
      </div>
    `).join('');

  } catch(err) {
    container.innerHTML = '<div class="card" style="color:var(--danger); text-align:center;">Failed to load flight status data.</div>';
  }
}
</script>
{% endblock %}
